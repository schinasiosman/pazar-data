name: Daily prices
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}          # "Run workflow" button for a manual update
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests==2.32.3 pdfplumber==0.11.4 pillow==10.4.0 cairosvg==2.7.1
      - name: Yesterday's lists (used when a chain's site is down)
        run: |
          mkdir -p data
          curl -sfL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/raw.json.gz" | gunzip > data/raw.json || rm -f data/raw.json
      - name: Download and match prices
        run: python pipeline/run.py
      - name: Prepare the website
        run: |
          mkdir -p public
          cp -r site/* public/
          cp data/prices.json public/prices.json
          gzip -9 -c data/raw.json > public/raw.json.gz
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deploy
        uses: actions/deploy-pages@v4
